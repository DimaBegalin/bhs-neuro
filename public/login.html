<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHS · вход</title>
<style>
:root{--orange:#F16B14;--green:#22B57C;--alert:#F0666B;--bg:#090D15;--card:#141A26;
--card2:#1B2231;--line:rgba(255,255,255,.08);--text:#F6F8FB;--muted:#94A0B8;
--body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
border-radius:24px;padding:32px 30px}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.55}
label{display:block;font-size:13.5px;color:var(--muted);margin:20px 0 7px}
input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
border-radius:14px;padding:14px 16px;font-size:16px;font-family:var(--body)}
input:focus{outline:0;border-color:var(--orange)}
button{width:100%;border:0;background:var(--orange);color:#fff;font-family:var(--body);
font-weight:600;font-size:16px;padding:15px;border-radius:14px;cursor:pointer;margin-top:22px}
button:disabled{opacity:.5;cursor:default}
.state{font-size:14px;margin-top:16px;line-height:1.55;min-height:20px;color:var(--muted)}
.state.bad{color:var(--alert)}
.state.ok{color:var(--green)}
.who{background:var(--card2);border:1px solid var(--line);border-radius:14px;
padding:13px 16px;margin-top:20px;font-size:14.5px}
.who b{font-weight:600}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
</style></head><body>

<div class="box">
  <h1>Нейропрофориентация</h1>
  <p class="sub">Вход для менеджера. Тест и отчёты работают на этом ноутбуке,
    поэтому программа на нём должна быть запущена.</p>

  <div id="who" class="who" hidden></div>

  <div id="form">
    <label for="name">Ваше имя и фамилия</label>
    <input id="name" placeholder="Анна Петрова" autocomplete="name">
    <p class="hint">Подписывает рабочее место: по нему в панели школы видно,
      кто проводил визит.</p>

    <label for="pin">Код школы</label>
    <input id="pin" type="password" placeholder="код" autocomplete="off">

    <button id="enter">Войти</button>
  </div>

  <div class="state" id="state">Проверяю программу на этом ноутбуке...</div>
</div>

<script>
const BRIDGE = "http://127.0.0.1:8765";
const PIN = "2026";

function setState(text, kind){
  const box = document.getElementById("state");
  box.textContent = text || "";
  box.className = "state" + (kind ? " " + kind : "");
}

let bridgeReady = false;

async function checkBridge(){
  try{
    const r = await fetch(BRIDGE + "/status");
    const status = await r.json();
    bridgeReady = true;
    const name = status.operator_name || "";
    const who = document.getElementById("who");
    who.hidden = false;
    who.innerHTML = name
      ? "Рабочее место: <b>" + name.replace(/[<>&]/g, "") + "</b>"
      : "Рабочее место пока не подписано.";
    if(name){ document.getElementById("name").value = name; }
    setState(status.connected
      ? "Прибор на связи, батарея " + (status.battery || 0) + "%."
      : "Программа работает, ободок пока не найден. Его можно включить позже.",
      status.connected ? "ok" : "");
  }catch(e){
    bridgeReady = false;
    // без программы на ноутбуке тест запишет только ответы, без мозга
    setState("Программа не запущена на этом ноутбуке. Запустите её "
      + "(«Нейропрофориентация BHS»), иначе тест пройдёт без нейро-слоя.", "bad");
  }
}

document.getElementById("enter").addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  const pin = document.getElementById("pin").value.trim();
  if(!name){ setState("Впишите имя: без него визиты в панели не различить.", "bad"); return; }
  if(pin !== PIN){
    document.getElementById("pin").value = "";
    setState("Код школы не подошёл.", "bad");
    return;
  }
  const button = document.getElementById("enter");
  button.disabled = true;
  if(bridgeReady){
    try{
      await fetch(BRIDGE + "/operator", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: name})
      });
    }catch(e){ /* подпись не легла, вход всё равно пускаем */ }
  }
  sessionStorage.setItem("bhs_manager", name);
  location.href = "panel";
});

document.getElementById("pin").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){ document.getElementById("enter").click(); }
});

checkBridge();
setInterval(checkBridge, 5000);
</script></body></html>
