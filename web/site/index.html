<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BHS · нейропрофориентация</title>
<script>
/* Главная только распределяет: вошедшего в панель, остальных на вход.
   Держим её отдельной страницей, чтобы адрес сайта можно было диктовать
   без хвостов. */
(function(){
  var signed = false;
  try { signed = !!JSON.parse(localStorage.getItem("bhs_session") || "null"); }
  catch (e) { signed = false; }
  location.replace(signed ? "admin" : "login");
})();
</script>
</head><body></body></html>
