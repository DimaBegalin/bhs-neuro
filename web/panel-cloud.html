<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHS · панель нейропрофориентации</title>
<style>
:root{--orange:#F16B14;--green:#22B57C;--alert:#F0666B;--bg:#090D15;--card:#141A26;
--card2:#1B2231;--line:rgba(255,255,255,.08);--text:#F6F8FB;--muted:#94A0B8;
--body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;
padding:30px 20px 60px}
.wrap{max-width:1060px;margin:0 auto}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14.5px;margin-top:6px}
button,.btn{border:0;background:var(--orange);color:#fff;font-family:var(--body);
font-weight:600;font-size:15px;padding:13px 24px;border-radius:14px;cursor:pointer;
text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.gate{display:flex;gap:10px;margin-top:22px;max-width:420px}
input{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
border-radius:14px;padding:13px 16px;font-size:16px;font-family:var(--body)}
.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 16px;flex-wrap:wrap}
.toolbar .count{color:var(--muted);font-size:14px;margin-left:auto}
.state{font-size:14px;color:var(--muted);margin-top:14px;min-height:20px}
.state.bad{color:var(--alert)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.p-head{display:flex;align-items:baseline;gap:10px}
.p-name{font-size:19px;font-weight:600}
.p-when{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-meta{color:var(--muted);font-size:14px;margin-top:4px}
.p-stats{display:flex;gap:16px;margin:14px 0;align-items:center}
.p-stat b{font-size:20px;font-weight:600;display:block}
.p-stat span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12.5px;padding:5px 12px;border-radius:999px}
.badge.ok{background:rgba(34,181,124,.18);color:#5BD8A4}
.badge.warn{background:rgba(240,102,107,.16);color:var(--alert)}
.p-actions{display:flex;gap:8px;margin-top:12px}
.p-actions>*{flex:1;font-size:14px;padding:11px}
.empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--line);
border-radius:20px}
</style></head><body><div class="wrap">

<div class="head">
  <div style="flex:1;min-width:240px">
    <h1>Нейропрофориентация · визиты</h1>
    <p class="sub">Визиты этого ноутбука. Карточка появляется сразу после теста.</p>
  </div>
  <a class="btn" href="./" id="new-client">Новый клиент</a>
</div>

<div class="gate" id="gate">
  <input id="pin" type="password" placeholder="код доступа" autocomplete="off">
  <button id="enter">Войти</button>
</div>
<div class="state" id="state"></div>

<div id="workspace" hidden>
  <div class="toolbar">
    <input id="search" placeholder="поиск по имени" style="max-width:320px">
    <button class="ghost" id="refresh">Обновить</button>
    <span class="count" id="count"></span>
  </div>
  <div class="cards" id="cards"></div>
</div>

</div><script>
const BRIDGE = "http://127.0.0.1:8765";
const PIN = "2026";
let all = [];

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function setState(text, bad){
  const box = document.getElementById("state");
  box.textContent = text || "";
  box.className = "state" + (bad ? " bad" : "");
}

async function load(){
  try{
    const r = await fetch(BRIDGE + "/sessions");
    all = (await r.json()).items || [];
    setState("");
  }catch(e){
    all = [];
    // программы на этом ноутбуке нет: визиты хранятся у неё, показывать нечего
    setState("Программа не запущена на этом ноутбуке. Визиты хранятся в ней, "
      + "поэтому список пуст. Запустите её и обновите страницу.", true);
  }
  render();
}

function render(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  const items = all.filter(c => !q || (c.student_name||"").toLowerCase().includes(q));
  document.getElementById("count").textContent = items.length + " из " + all.length;
  const box = document.getElementById("cards");
  if(!items.length){
    box.innerHTML = '<div class="empty">Пока ни одного визита. Первый появится '
      + 'сразу после прохождения теста.</div>';
    return;
  }
  box.innerHTML = items.map(c => {
    const track = c.track === "kk" ? "казахское отделение" : "русское отделение";
    const neuro = c.has_eeg === null || c.has_eeg === undefined ? ""
      : (c.has_eeg ? '<span class="badge ok">нейро-слой записан</span>'
                   : '<span class="badge warn">только поведение</span>');
    const iaf = c.iaf ? '<div class="p-stat"><b>' + Number(c.iaf).toFixed(1)
      + '</b><span>темп, Гц</span></div>' : "";
    const id = esc(c.session_id);
    const actions = c.report
      ? '<a class="btn" href="' + BRIDGE + '/report/' + id + '.html" target="_blank">Отчёт</a>'
        + '<button class="ghost" data-pdf="' + id + '">Скачать PDF</button>'
      : '<span class="btn ghost" style="opacity:.4">Отчёт готовится</span>';
    return '<div class="person">'
      + '<div class="p-head"><span class="p-name">' + esc(c.student_name) + '</span>'
      + '<span class="p-when">' + esc(c.started_at) + '</span></div>'
      + '<div class="p-meta">' + esc(c.grade || "класс не указан") + ' · ' + track + '</div>'
      + '<div class="p-stats">' + iaf + '<div class="p-stat">' + neuro + '</div></div>'
      + '<div class="p-actions">' + actions + '</div></div>';
  }).join("");
}

/* PDF печатает программа на ноутбуке тем же браузером, что рисует отчёт,
   поэтому документ выходит один в один с экраном. Печать занимает несколько
   секунд, и кнопка обязана это показывать, иначе её жмут повторно */
document.getElementById("cards").addEventListener("click", async (event) => {
  const button = event.target.closest("[data-pdf]");
  if(!button){ return; }
  const id = button.getAttribute("data-pdf");
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Готовлю...";
  try{
    const response = await fetch(BRIDGE + "/report/" + encodeURIComponent(id) + ".pdf");
    if(!response.ok){ throw new Error("код " + response.status); }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = id + ".pdf";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setState("");
  }catch(e){
    setState("PDF не получился: " + e.message
      + ". Откройте отчёт и нажмите «Скачать PDF» внутри него.", true);
  }finally{
    button.disabled = false;
    button.textContent = label;
  }
});

document.getElementById("enter").addEventListener("click", () => {
  if(document.getElementById("pin").value.trim() !== PIN){
    document.getElementById("pin").value = "";
    setState("Код не подошёл.", true);
    return;
  }
  sessionStorage.setItem("bhs_panel", "1");
  document.getElementById("gate").hidden = true;
  document.getElementById("workspace").hidden = false;
  load(); setInterval(load, 20000);
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);

if(sessionStorage.getItem("bhs_panel")){
  document.getElementById("gate").hidden = true;
  document.getElementById("workspace").hidden = false;
  load(); setInterval(load, 20000);
}
</script></body></html>
