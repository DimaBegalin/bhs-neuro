<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHS · панель нейропрофориентации</title>
<style>
@font-face{font-family:'Halvar';src:url('fonts/HalvarBreit-Bd.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Halvar';src:url('fonts/HalvarBreit-Md.woff2') format('woff2');font-weight:500}
:root{--orange:#F16B14;--green:#22B57C;--alert:#F0666B;--bg:#090D15;--card:#141A26;
--card2:#1B2231;--line:rgba(255,255,255,.08);--text:#F6F8FB;--muted:#94A0B8;
--display:'Halvar','Archivo',sans-serif;--body:'Inter',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;
padding:30px 20px 60px}
.wrap{max-width:1060px;margin:0 auto}
h1{font-family:var(--display);font-size:28px;font-weight:700}
.sub{color:var(--muted);font-size:14.5px;margin-top:6px}
.gate{display:flex;gap:10px;margin-top:22px}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--text);
border-radius:14px;padding:13px 16px;font-size:16px;font-family:var(--body)}
button{border:0;background:var(--orange);color:#fff;font-family:var(--body);font-weight:600;
font-size:15px;padding:13px 24px;border-radius:14px;cursor:pointer}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.toolbar{display:flex;gap:10px;align-items:center;margin:24px 0 16px;flex-wrap:wrap}
.toolbar .count{color:var(--muted);font-size:14px;margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.p-head{display:flex;align-items:baseline;gap:10px}
.p-name{font-family:var(--display);font-size:19px;font-weight:500}
.p-when{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.p-meta{color:var(--muted);font-size:14px;margin-top:4px}
.p-stats{display:flex;gap:16px;margin:14px 0}
.p-stat b{font-size:20px;font-weight:600;display:block}
.p-stat span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12.5px;padding:5px 12px;border-radius:999px;margin-top:2px}
.badge.ok{background:rgba(34,181,124,.18);color:#5BD8A4}
.badge.warn{background:rgba(240,102,107,.16);color:var(--alert)}
.p-actions{display:flex;gap:8px;margin-top:12px}
.p-actions a{flex:1;text-align:center;text-decoration:none;background:var(--card2);
border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font-size:14px}
.p-actions a.main{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.empty{color:var(--muted);padding:40px;text-align:center;border:1px dashed var(--line);
border-radius:20px}
</style></head><body><div class="wrap">

<h1>Нейропрофориентация · визиты</h1>
<p class="sub">Каждый прошедший тест появляется здесь карточкой. Отчёт открывается кнопкой.</p>

<div class="gate" id="gate">
  <input id="pin" type="password" placeholder="код доступа" autocomplete="off">
  <button id="enter">Войти</button>
</div>

<div id="workspace" hidden>
  <div class="toolbar">
    <input id="search" placeholder="поиск по имени" style="flex:1;max-width:320px">
    <button class="ghost" id="refresh">Обновить</button>
    <span class="count" id="count"></span>
  </div>
  <div class="cards" id="cards"></div>
</div>

</div><script>
const PIN = "2026";
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

let all = [];
async function load(){
  try{
    const r = await fetch("http://127.0.0.1:8765/sessions");
    all = (await r.json()).items || [];
  }catch(e){ all = []; }
  render();
}
function render(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  const items = all.filter(c => !q || c.student_name.toLowerCase().includes(q));
  document.getElementById("count").textContent = items.length + " из " + all.length;
  const box = document.getElementById("cards");
  if(!items.length){
    box.innerHTML = '<div class="empty">Пока ни одного визита. Первый появится '
      + 'сразу после прохождения теста.</div>';
    return;
  }
  box.innerHTML = items.map(c => {
    const track = c.track === "kk" ? "казахское отделение" : "русское отделение";
    const neuro = c.has_eeg === null ? "" : (c.has_eeg
      ? '<span class="badge ok">нейро-слой записан</span>'
      : '<span class="badge warn">только поведение</span>');
    const iaf = c.iaf ? '<div class="p-stat"><b>' + c.iaf.toFixed(1)
      + '</b><span>темп, Гц</span></div>' : "";
    const report = c.report
      ? '<a class="main" href="' + esc(c.report) + '" target="_blank">Открыть отчёт</a>'
      : '<a href="#" onclick="return false" style="opacity:.4">Отчёт готовится</a>';
    return '<div class="person">'
      + '<div class="p-head"><span class="p-name">' + esc(c.student_name) + '</span>'
      + '<span class="p-when">' + esc(c.started_at) + '</span></div>'
      + '<div class="p-meta">' + esc(c.grade || "класс не указан") + ' · ' + track + '</div>'
      + '<div class="p-stats">' + iaf + '<div class="p-stat">' + neuro + '</div></div>'
      + '<div class="p-actions">' + report + '</div></div>';
  }).join("");
}
document.getElementById("enter").addEventListener("click", () => {
  if(document.getElementById("pin").value.trim() !== PIN){
    document.getElementById("pin").value = ""; return;
  }
  document.getElementById("gate").hidden = true;
  document.getElementById("workspace").hidden = false;
  load(); setInterval(load, 20000);
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);
</script></body></html>
